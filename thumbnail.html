<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thumbnail Gallery — RefaMc</title>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f0f0f0;
      --mid: #1a1a1a;
      --border: #2e2e2e;
      --accent: #e8e8e8;
      --dim: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    .page-wrapper {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px 60px;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 56px;
    }

    .back-link {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--fg); }
    .back-link::before { content: '←'; font-size: 14px; }

    .breadcrumb {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--dim);
      text-transform: uppercase;
    }

    .breadcrumb span { color: var(--fg); }

    .title-block {
      margin-bottom: 48px;
      animation: fadeUp 0.5s ease both;
    }

    .title-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: 'Jersey 25', cursive;
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: 6px;
      line-height: 1;
    }

    h1 .outline {
      -webkit-text-stroke: 1px var(--fg);
      color: transparent;
    }

    .count-badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--dim);
      margin-top: 12px;
      padding: 4px 10px;
      border: 1px solid var(--border);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      animation: fadeUp 0.5s 0.1s ease both;
    }

    /* KOTAK GAMBAR */
    .item {
      position: relative;
      background: var(--bg);
      overflow: hidden;
      aspect-ratio: 16/9;
      cursor: pointer;
      transform: translateZ(0); 
      mask-image: -webkit-radial-gradient(white, black);
      isolation: isolate;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1);
      transform-origin: center center;
      backface-visibility: hidden;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .item:hover img {
      transform: scale(1.2);
    }

    .item::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      z-index: 1;
      pointer-events: none;
    }

    .item:hover::after {
      animation: shine 0.75s ease forwards;
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }

    .item-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
      opacity: 0;
      display: flex;
      align-items: flex-end;
      padding: 20px;
      transform: translateY(15px);
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 2;
      pointer-events: none;
    }

    .item:hover .item-overlay { 
      opacity: 1; 
      transform: translateY(0);
    }

    .item-num {
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.9);
      font-weight: 700;
    }

    .item::before {
      content: attr(data-index);
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.4);
      z-index: 3;
      transition: color 0.3s ease;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    .item:hover::before {
      color: rgba(255,255,255,0.9);
    }

    .page-footer {
      margin-top: 32px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 2px;
    }

    /* ==== LIGHTBOX / POPUP STYLES ==== */
    .lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      backdrop-filter: blur(5px); /* Efek blur pada background */
    }

    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      transform: scale(0.95);
      transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .lightbox.active img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 40px;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-family: sans-serif;
      transition: color 0.2s, transform 0.2s;
      z-index: 10000;
    }

    .lightbox-close:hover {
      color: white;
      transform: scale(1.1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .page-wrapper { padding: 0 20px 40px; }
      .gallery { grid-template-columns: 1fr; }
      .lightbox-close { top: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <header class="site-header">
      <a href="index.html" class="back-link">Back to Home</a>
      <span class="breadcrumb">RefaMc / <span>Thumbnail</span></span>
    </header>

    <div class="title-block">
      <div class="title-label">Portfolio</div>
      <h1>THUMB<span class="outline">NAIL</span></h1>
      <div class="count-badge" id="count">00 WORKS</div>
    </div>

    <div class="gallery" id="gallery"></div>

    <div class="page-footer">
      <span>© REFAMC 2025</span>
      <span>THUMBNAIL — MINECRAFT</span>
    </div>

  </div>

  <!-- LIGHTBOX / POPUP CONTAINER -->
  <div id="lightbox" class="lightbox">
    <span class="lightbox-close">&times;</span>
    <img id="lightbox-img" src="" alt="Popup Image">
  </div>

  <script>
    // 🔥 AUTO LIST & OTOMATIS MENDETEKSI GAMBAR
    const gallery = document.getElementById("gallery");
    const count = document.getElementById("count");
    
    // Variabel untuk Lightbox
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxClose = document.querySelector(".lightbox-close");

    let validImages = [];
    let currentIndex = 1;

    function checkNextImage() {
      const img = new Image();
      const fileName = `thumb${currentIndex}.webp`;
      
      img.src = `thumb/${fileName}`;

      img.onload = function() {
        validImages.push(fileName);
        currentIndex++;
        checkNextImage();
      };

      img.onerror = function() {
        tampilkanGaleri();
      };
    }

    function tampilkanGaleri() {
      validImages.reverse().forEach((fileName, i) => {
        const actualNum = validImages.length - i;
        const indexStr = String(actualNum).padStart(2, '0');

        const item = document.createElement("div");
        item.className = "item";
        item.setAttribute("data-index", indexStr);

        item.innerHTML = `
          <img src="thumb/${fileName}" alt="Thumbnail ${indexStr}">
          <div class="item-overlay">
            <span class="item-num">${indexStr} / THUMBNAIL</span>
          </div>
        `;

        // Event saat gambar diklik (Buka Popup)
        item.addEventListener("click", () => {
          bukaLightbox(`thumb/${fileName}`);
        });

        gallery.appendChild(item);
      });

      count.textContent = String(validImages.length).padStart(2, '0') + " WORKS";
    }

    // FUNGSI LIGHTBOX
    function bukaLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add("active");
    }

    function tutupLightbox() {
      lightbox.classList.remove("active");
      // Hapus src setelah animasi selesai supaya tidak berkedip saat buka gambar lain
      setTimeout(() => {
        lightboxImg.src = "";
      }, 300);
    }

    // Tutup popup jika tombol X diklik
    lightboxClose.addEventListener("click", tutupLightbox);

    // Tutup popup jika area background gelap diklik
    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) {
        tutupLightbox();
      }
    });

    // Mulai proses pendeteksian otomatis
    checkNextImage();
  </script>
</body>
</html>
